name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build lib/
        run: python build/build_lib.py
      - name: Syntax check
        run: |
          node --check lib/client.js
          python -m py_compile lib/engine/studio_bridge.py
      - name: Test
        run: npm test
